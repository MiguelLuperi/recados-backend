name: Backend Deploy via SemVer Tag

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm install

      - name: Validar servidor
        run: |
          echo "Backend validado"

      - name: Exibir versão
        run: |
          echo "Deploy da versão ${GITHUB_REF_NAME}"

      - name: Finalizar deploy
        run: |
          echo "Deploy backend concluído com sucesso"